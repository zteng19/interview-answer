[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusion-sim"
version = "0.1.0"
description = "PoC: multi-agent collusion simulation producing simulated risk-pattern cards for human review"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["collusion_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
