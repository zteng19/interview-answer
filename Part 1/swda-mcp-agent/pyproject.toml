[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swda-mcp-agent"
version = "1.0.0"
description = "SWDA Part 1C PoC: Service Recommendation Agent exposed through a governed MCP interface"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.26,<2",     # official MCP Python SDK; 1.x API pinned, isolated in swda_agent/server.py
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["swda_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests and internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "swda_agent.server"
# The MCP SDK's server decorators are untyped.
disallow_untyped_decorators = false
disallow_untyped_calls = false
